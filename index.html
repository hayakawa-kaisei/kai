<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AIゼミで校歌リミックス</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- スタート画面（iPadの自動再生制限を回避するため、最初のタップを受ける） -->
<div id="start-screen">
  <div class="start-inner">
    <p class="start-eyebrow">おもゼミ 展示</p>
    <h1 class="start-title">AIゼミで<br>校歌リミックス</h1>
    <p class="start-sub">生徒たちがプロンプトで生み出した、19曲のオリジナル校歌</p>
    <button id="start-btn" type="button">タップしてはじめる</button>
  </div>
</div>

<!-- メイン展示画面 -->
<div id="stage" hidden>

  <div id="bg-art" aria-hidden="true"></div>
  <div id="bg-veil" aria-hidden="true"></div>

  <header id="stage-header">
    <p class="header-eyebrow">おもゼミ 展示 &mdash; AIゼミで校歌リミックス</p>
    <p id="track-count" class="header-count">01 / 19</p>
  </header>

  <main id="now-playing">
    <div class="art-wrap">
      <img id="cover-img" alt="" width="1024" height="1024">
      <div id="playing-indicator" class="playing-indicator" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div class="track-info">
      <h2 id="track-title" class="track-title"></h2>

      <div class="prompt-box">
        <p class="prompt-label">生成プロンプト</p>
        <p id="track-prompt" class="prompt-text"></p>
      </div>
    </div>
  </main>

  <div id="track-strip" class="track-strip" aria-label="曲一覧（横スクロール）"></div>

  <footer id="controls">
    <div class="progress-row">
      <span id="time-current" class="time">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="再生位置">
      <span id="time-total" class="time">0:00</span>
    </div>

    <div class="buttons-row">
      <button id="btn-choose" class="btn btn-secondary" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 5h16v2H4zm0 6h16v2H4zm0 6h16v2H4z"/></svg>
        <span>曲をえらぶ</span>
      </button>

      <div class="transport">
        <button id="btn-prev" class="btn btn-icon" type="button" aria-label="前の曲">
          <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button id="btn-play" class="btn btn-icon btn-play" type="button" aria-label="再生・一時停止">
          <svg id="icon-play" viewBox="0 0 24 24" width="30" height="30"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" width="30" height="30" hidden><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>
        <button id="btn-next" class="btn btn-icon" type="button" aria-label="次の曲">
          <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M6 18 14.5 12 6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

      <button id="btn-mute" class="btn btn-secondary" type="button" aria-label="ミュート切替">
        <svg id="icon-vol-on" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12z"/></svg>
        <svg id="icon-vol-off" viewBox="0 0 24 24" width="22" height="22" hidden><path fill="currentColor" d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.42.05-.63zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.92 8.92 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
      </button>
    </div>
  </footer>
</div>

<!-- 選曲グリッド -->
<div id="picker" hidden>
  <div class="picker-header">
    <h2>曲をえらぶ</h2>
    <button id="picker-close" class="btn btn-icon" type="button" aria-label="閉じる">
      <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="m6.4 19 12.6-12.6-1.4-1.4L5 17.6z M5 6.4 17.6 19l1.4-1.4L6.4 5z"/></svg>
    </button>
  </div>
  <div id="picker-grid" class="picker-grid"></div>
</div>

<audio id="player" preload="auto"></audio>

<script src="script.js"></script>
</body>
</html>
